# create-toolkit Pack 安装清单
# install-pack 脚本读取此文件：公共作者层部署到 .agents/，Cursor 入口保留薄适配

pack: create-toolkit
version: 1.6.0
description: 资产创建工具箱；默认安装四个工具无关状态型 Workflow、公共资产审计 Skill 与 Cursor 薄适配
record_root: .agents

mappings:
  # 公共作者层：Cursor / Claude Code / Codex CLI 共用
  - source: skills/create-skill-workflow
    target_root: .agents
    target: skills/create-skill-workflow
    type: directory
  - source: skills/create-subagent-workflow
    target_root: .agents
    target: skills/create-subagent-workflow
    type: directory
  - source: skills/create-command-workflow
    target_root: .agents
    target: skills/create-command-workflow
    type: directory
  - source: skills/audit-agent-assets
    target_root: .agents
    target: skills/audit-agent-assets
    type: directory
  - source: skills/create-rule-workflow
    target_root: .agents
    target: skills/create-rule-workflow
    type: directory

  # Cursor 薄入口
  - source: adapters/cursor/create-skill.md
    target: commands/create-skill.md
  - source: adapters/cursor/create-subagent.md
    target: commands/create-subagent.md
  - source: adapters/cursor/create-command.md
    target: commands/create-command.md
  - source: adapters/cursor/create-rule.md
    target: commands/create-rule.md

  # Cursor 宿主 renderer
  - source: adapters/cursor/render_subagent.py
    target: adapters/create-subagent/render_subagent.py
  - source: adapters/cursor/render_command.py
    target: adapters/create-command/render_command.py
  - source: adapters/cursor/render_rule.py
    target: adapters/create-rule/render_rule.py

dependencies:
  note: 无外部 MCP 依赖，所有组件自包含
