id: create-subagent-workflow
version: 1.0.0
description: 创建工具无关 Agent Contract 的持久化控制流

state:
  persistence: json
  required_fields:
    - schema_version
    - workflow_id
    - status
    - current_stage
    - spec
    - attempts
    - history
    - errors
    - artifacts

stages:
  - id: analyze
    kind: human_or_agent_gate
    accepted_events: [analyzed]
    on_event: dependencies

  - id: dependencies
    kind: machine_guard
    on_success: scaffold
    on_failure: failed
    retry:
      max_attempts: 3
      exhausted_status: blocked

  - id: scaffold
    kind: deterministic_action
    on_success: refine
    on_target_exists: blocked

  - id: refine
    kind: human_or_agent_gate
    accepted_events: [refined]
    on_event: validate

  - id: validate
    kind: machine_validator
    on_success: adapt
    on_failure: failed
    retry:
      max_attempts: 3
      exhausted_status: blocked

  - id: adapt
    kind: human_or_adapter_gate
    accepted_events: [adapted, adaptation-not-required]
    on_event: complete

  - id: complete
    kind: terminal

exit_codes:
  success: 0
  waiting_gate: 2
  retryable_failure: 3
  blocked: 4
